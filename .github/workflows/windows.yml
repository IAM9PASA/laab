name: Windows

# Builds the Windows installer (LAAB_x.y.z_x64-setup.exe). Download it from
# the run's Artifacts. Runs on every push, or by hand from the Actions tab.
# Pushing a tag like v0.5.3-windows.1 also publishes a GitHub release with
# the installer, once the build and the tests pass.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Frontend
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test

      # OpenSSL for SQLCipher is built from source; it needs Perl, which the
      # runner has (Strawberry Perl).
      - name: Build installer
        working-directory: desktop
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: LAAB-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The default shell (PowerShell), not bash: OpenSSL's build needs
      # Strawberry Perl, and Git Bash's own Perl lacks modules it uses.
      - name: Backend
        working-directory: desktop/src-tauri
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LAAB-windows-x64
          path: installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" installer/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "LAAB $TAG" \
            --notes "Windows build of LAAB. Download LAAB_*_x64-setup.exe below and run it. Windows SmartScreen may warn that the installer is unsigned: choose More info, then Run anyway."
