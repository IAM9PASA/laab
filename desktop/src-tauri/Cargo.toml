[package]
name = "laab"
version = "0.5.3"
description = "LAAB, a LINE client for the desktop"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "laab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
line-rs = { git = "https://github.com/softnetics/line-rs", rev = "addf69c2e886a2364a396ce360093a62119dcb32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-window-state = "2.5.0"
url = "2.5.8"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Keep function names so crash reports are readable; debug info still goes.
strip = "debuginfo"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
objc2-app-kit = "0.3"
security-framework = "3"
objc2-foundation = { version = "0.3", features = ["block2", "NSNotification", "NSOperation", "NSProcessInfo"] }
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetImageGenerator", "AVTime", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGBitmapContext", "CGColorSpace", "CGContext"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFURL", "CFBase", "CFCGTypes"] }

[target.'cfg(windows)'.dependencies]
# SQLCipher uses CommonCrypto on macOS; on Windows it needs OpenSSL, built in.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
# The database key lives in Windows Credential Manager, as it does in the
# macOS keychain.
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.3"
tauri-plugin-notification = "2"
# A second launch (a laab:// link, `LAAB mcp`) hands over to the running app.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Closing the window hides LAAB to the notification area; it can start
# with Windows.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Globalization"] }
# QR codes for liff.scanCode(), which macOS reads with Vision.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
rqrr = "0.9"
